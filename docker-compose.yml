services:
  webanime:
    build: .
    container_name: webanime-app
    ports:
      - "1234:1234"
    environment:
      - NODE_ENV=production
      - PORT=1234
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1234/api/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
