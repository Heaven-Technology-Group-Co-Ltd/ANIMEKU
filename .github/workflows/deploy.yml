name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/project/webanime

            echo "==> Checking working tree (fail-closed; only docs/LEDGER.md drift tolerated)..."
            PORCELAIN="$(git status --porcelain)"
            LEDGER_BACKUP=""
            if [ -z "$PORCELAIN" ]; then
              echo "==> Working tree clean."
            else
              # Fail-closed allowlist: every porcelain line must be a
              # modification (M in index and/or worktree) of the single
              # documented path `docs/LEDGER.md` — the operational project
              # ledger, which is documentation-only and drifts on the VPS
              # (local session log appends). Anything else — other paths,
              # untracked (??), deletions, renames — keeps the deploy blocked.
              # Exact match only: no `docs/*`, no `*.md`, no globs.
              BLOCKERS="$(printf '%s\n' "$PORCELAIN" | grep -v -E '^(M | M|MM) docs/LEDGER\.md$' || true)"
              if [ -z "$BLOCKERS" ]; then
                echo "WARNING: only docs/LEDGER.md is modified locally (operational ledger drift). Backing up and proceeding; all other tracked changes remain blockers."
                git status --short
                LEDGER_BACKUP="/tmp/prod-LEDGER-backup.md"
                cp docs/LEDGER.md "$LEDGER_BACKUP"
                echo "Backed up docs/LEDGER.md to $LEDGER_BACKUP."
                # Neutralize ONLY the tolerated ledger file so checkout/reset can
                # proceed: backup already saved above; this handles both worktree
                # (" M") and staged ("M "/"MM") modifications without touching
                # any other path. Fail-closed: abort if backup missing or
                # neutralize fails (set -e aborts on restore failure).
                if [ ! -f "$LEDGER_BACKUP" ]; then
                  echo "ERROR: ledger backup missing at $LEDGER_BACKUP — refusing to neutralize."
                  exit 1
                fi
                git restore --source=HEAD --staged --worktree -- docs/LEDGER.md
                echo "Neutralized docs/LEDGER.md (exact file only) for checkout/reset; backup preserved."
              else
                echo "ERROR: Production working tree is dirty."
                echo "$BLOCKERS"
                git status --short
                exit 1
              fi
            fi

            echo "==> Syncing main..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Preserve production-local ledger drift across the reset above:
            # without this restore, `reset --hard` would silently discard the
            # tolerated docs/LEDGER.md modification. Never discard automatically.
            # Fail-closed: if a backup was expected but is missing, abort rather
            # than deploying without the production-local ledger.
            if [ -n "${LEDGER_BACKUP:-}" ]; then
              if [ ! -f "$LEDGER_BACKUP" ]; then
                echo "ERROR: expected ledger backup missing at $LEDGER_BACKUP — refusing to continue without restore."
                exit 1
              fi
              cp "$LEDGER_BACKUP" docs/LEDGER.md
              echo "Restored production-local docs/LEDGER.md from backup (deploy does not discard ledger drift)."
            fi

            echo "==> Saving current image for rollback..."
            # webanime:latest is the real compose image (see docker-compose.yml
            # `image:` key), so this tag preserves the currently deployed image.
            if docker image inspect webanime:latest >/dev/null 2>&1; then
              docker tag webanime:latest webanime:rollback
              echo "Saved rollback image: $(docker image inspect --format '{{.Id}}' webanime:rollback)"
            else
              echo "WARNING: no webanime:latest image found — nothing to roll back to."
            fi

            echo "==> Loading production env for build..."
            # NEXT_PUBLIC_* are baked into client JS at `docker build` time.
            # The VPS .env must define the real NEXT_PUBLIC_SITE_URL before
            # deploy; compose build.args forward it (see docker-compose.yml).
            # No new secrets are introduced — same file compose already reads.
            set -a
            if [ -f .env ]; then
              # shellcheck disable=SC1091
              . ./.env
              echo "Loaded .env (NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-<unset>})."
            else
              echo "WARNING: no .env file — build will bake localhost fallback."
            fi
            set +a
            if [ -z "${NEXT_PUBLIC_SITE_URL:-}" ]; then
              echo "ERROR: NEXT_PUBLIC_SITE_URL is required in production — set it to your canonical origin. Refusing to bake localhost fallback."
              exit 1
            fi

            echo "==> Validating NEXT_PUBLIC_SITE_URL (fail-loud, no loopback/local in prod)..."
            if ! node -e "const raw=(process.env.NEXT_PUBLIC_SITE_URL||'').trim(); if(!raw){console.error('ERROR: NEXT_PUBLIC_SITE_URL is empty');process.exit(1)} let u; try{u=new URL(raw)}catch(e){console.error('ERROR: NEXT_PUBLIC_SITE_URL is not a valid absolute URL');process.exit(1)} if(u.protocol!=='http:'&&u.protocol!=='https:'){console.error('ERROR: NEXT_PUBLIC_SITE_URL must use http(s), got '+u.protocol);process.exit(1)} const h=u.hostname.replace(/^\\[|\\]$/g,'').toLowerCase().replace(/\\.\$/, ''); const exact=new Set(['localhost','127.0.0.1','0.0.0.0','::1']); let loop=exact.has(h)||/^127\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\$/.test(h)||h.indexOf('127.0.0.1')!==-1||h==='localhost'||h.endsWith('.localhost')||h.endsWith('.local'); if(loop){console.error('ERROR: NEXT_PUBLIC_SITE_URL must not be loopback/local in production (hostname '+u.hostname+')');process.exit(1)}"; then
              echo "ERROR: NEXT_PUBLIC_SITE_URL failed production validation — refusing to deploy."
              exit 1
            fi

            echo "==> Building and starting ANIMEKU..."
            docker compose up -d --build --remove-orphans

            echo "==> Waiting for application health (http://127.0.0.1:1234/api/health)..."
            HEALTH_URL="http://127.0.0.1:1234/api/health"
            for i in $(seq 1 30); do
              # 1) Check HTTP health endpoint returns 200 and valid JSON with status ok + service ANIMEKU
              if curl -fsS "$HEALTH_URL" 2>/dev/null | grep -q '"status":"ok"' && curl -fsS "$HEALTH_URL" 2>/dev/null | grep -q '"service":"ANIMEKU"'; then
                echo "Health endpoint responded ok (attempt $i/30)."

                # 2) Prefer Docker health status if available
                DOCKER_HEALTH=$(docker inspect --format '{{.State.Health.Status}}' webanime-app 2>/dev/null || echo "no-healthcheck")
                echo "Docker health status: $DOCKER_HEALTH"

                if [ "$DOCKER_HEALTH" = "healthy" ] || [ "$DOCKER_HEALTH" = "no-healthcheck" ]; then
                  echo "Health check passed (endpoint + docker: $DOCKER_HEALTH)."
                  exit 0
                fi

                if [ "$DOCKER_HEALTH" = "starting" ]; then
                  echo "Container still starting but endpoint is healthy — considering passed (endpoint is authoritative)."
                  exit 0
                fi

                echo "Endpoint ok but docker health is $DOCKER_HEALTH, retrying..."
              else
                echo "Attempt $i/30: health endpoint not ready yet..."
              fi

              sleep 2
            done

            echo "Health check failed. Diagnostics:"
            echo "--- curl $HEALTH_URL ---"
            curl -fsS "$HEALTH_URL" 2>&1 || echo "curl failed"
            echo "--- docker inspect health ---"
            docker inspect --format '{{json .State.Health}}' webanime-app 2>/dev/null || echo "no health data"
            echo "--- docker logs (tail 100) ---"
            docker logs --tail 100 webanime-app 2>&1 || true
            echo "--- docker compose ps ---"
            docker compose ps 2>&1 || true

            echo "Rolling back..."

            if docker image inspect webanime:rollback >/dev/null 2>&1; then
              # Restore the previously deployed image WITHOUT --build so the
              # broken tree is not rebuilt; then recreate the container from it.
              docker tag webanime:rollback webanime:latest
              docker compose up -d --force-recreate --no-build

              echo "==> Verifying rollback health..."
              ROLLBACK_OK=0
              for i in $(seq 1 15); do
                if curl -fsS "$HEALTH_URL" 2>/dev/null | grep -q '"status":"ok"'; then
                  echo "Rollback health passed (attempt $i/15)."
                  ROLLBACK_OK=1
                  break
                fi
                echo "Rollback attempt $i/15: not ready yet..."
                sleep 2
              done

              if [ "$ROLLBACK_OK" = "1" ]; then
                echo "ROLLBACK RESULT: restored webanime:rollback, container re-healthy."
              else
                echo "ROLLBACK RESULT: FAILED — restored image is not healthy. Diagnostics:"
                docker logs --tail 100 webanime-app 2>&1 || true
                docker compose ps 2>&1 || true
              fi
            else
              echo "ROLLBACK RESULT: FAILED — no webanime:rollback image exists. Manual intervention required."
            fi

            exit 1
